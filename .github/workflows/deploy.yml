# Livraison continue : met en ligne l'API sur Hugging Face Spaces.
#
# Ne se declenche que sur un tag de version (v1.0.0, v1.1.0...). Deployer a chaque
# commit sur main mettrait en ligne du travail en cours ; le tag est la decision
# explicite de publier, et il donne un point de retour en arriere identifiable.

name: Deploiement

on:
  push:
    tags: ["v*"]
  # Permet aussi de relancer un deploiement a la main depuis l'onglet Actions,
  # par exemple apres avoir corrige un secret.
  workflow_dispatch:

jobs:
  # Publication de l'image dans le registre de GitHub. Ne depend d'aucun compte tiers
  # ni d'aucun abonnement : c'est la partie du deploiement qui marche toujours, et
  # c'est elle qui prouve que la chaine produit un livrable installable.
  #   docker run -p 8000:7860 ghcr.io/hydrale/futurisys-energy-api:v1.2.0
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # packages: write est indispensable pour pousser dans le registre. Sans cette
      # ligne, le jeton fourni au workflow est en lecture seule et la poussee echoue.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Entrainer le modele embarque dans l'image
        run: |
          pip install -r requirements.txt
          PYTHONPATH=src python -m futurisys.ml.train

      - name: S'identifier aupres du registre
        # Le jeton est fourni par GitHub le temps du job : rien a configurer, rien
        # a faire tourner, et il expire tout seul a la fin.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # QEMU permet a une machine x86 de construire aussi la variante ARM. Sans lui,
      # l'image ne sortirait qu'en x86 et les Mac recents la feraient tourner en
      # emulation, avec un avertissement a chaque lancement et des performances
      # degradees. Or la demonstration se fait justement sur un Mac ARM.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Construire et publier pour les deux architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Le nom du depot est mis en minuscules : le registre les exige, alors que
          # les noms de depots GitHub acceptent les majuscules.
          tags: |
            ghcr.io/${{ github.repository_owner }}/futurisys-energy-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/futurisys-energy-api:latest
          # Reutilise les couches de la construction precedente : sans ce cache,
          # chaque version reinstalle scikit-learn et ses dependances pour les deux
          # architectures, dont l'une en emulation.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verifier que l'image publiee demarre vraiment
        run: |
          # Le runner est en x86 : c'est la variante amd64 qui est tiree et testee.
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/futurisys-energy-api"
          docker run -d --name verification -p 7860:7860 \
            -e DATABASE_URL=sqlite:////tmp/futurisys.db \
            -e SECRET_KEY=cle-jetable-de-verification \
            "$IMAGE:${{ github.ref_name }}"
          for i in $(seq 1 40); do
            curl -sf http://localhost:7860/health && break
            sleep 3
          done
          curl -sf http://localhost:7860/health | tee /tmp/sante.json
          grep -q '"model_loaded":true' /tmp/sante.json

  deploiement:
    runs-on: ubuntu-latest
    # L'hebergement n'est tente qu'une fois l'image verifiee.
    needs: image
    # continue-on-error : Hugging Face reserve les Spaces Docker aux comptes PRO et
    # repond 402. Tant que l'abonnement n'est pas pris, cette etape echoue sans
    # remettre en cause la publication de l'image, qui est le livrable verifiable.
    continue-on-error: true
    # L'environnement GitHub "production" : c'est lui qui porte les secrets de mise
    # en ligne, separes de ceux utilises par les tests.
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          # Tout l'historique : Hugging Face refuse une poussee dont il ne peut pas
          # rattacher les commits a ce qu'il a deja.
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verifier que les secrets sont bien configures
        # Sans ce controle, l'etape suivante echoue avec une erreur d'authentification
        # incomprehensible. Ici, le message dit quoi faire.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Secret HF_TOKEN absent. Le creer dans Settings > Secrets and variables"
            echo "> Actions, avec un jeton Hugging Face ayant le droit d'ecriture."
            exit 1
          fi
          # HF_SPACE est facultative : sans elle, le script deduit le compte du jeton
          # et nomme le Space futurisys-energy-api. La renseigner ne sert qu'a viser
          # un autre compte ou un autre nom.
          if [ -n "$HF_SPACE" ]; then
            echo "Space impose par la variable HF_SPACE : $HF_SPACE"
          else
            echo "HF_SPACE non renseignee : le compte sera deduit du jeton."
          fi

      - name: Reentrainer le modele avant la mise en ligne
        # Le modele deployé est reconstruit depuis les donnees brutes plutot que repris
        # du depot : on est certain que ce qui part en ligne correspond au code du tag.
        run: |
          pip install -r requirements.txt
          PYTHONPATH=src python -m futurisys.ml.train

      - name: Publier sur Hugging Face Spaces
        id: publication
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Les secrets de l'application, distincts du jeton d'acces a la plateforme.
          # Le script les pose comme secrets du Space : ils ne sont ni dans le depot,
          # ni dans les journaux, ni dans le code envoye.
          APP_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          APP_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # Borne haute sur la version majeure : l'interface Python est stable sur une
          # majeure, contrairement a l'outil en ligne de commande qui a change de nom.
          pip install "huggingface_hub>=0.28,<2.0"
          # --space n'est passe que si la variable est renseignee : une chaine vide
          # ferait croire au script qu'un nom lui a ete impose.
          ESPACE="${{ vars.HF_SPACE }}"
          python scripts/deployer_sur_hugging_face.py \
            ${ESPACE:+--space "$ESPACE"} \
            --version "${{ github.ref_name }}"

      - name: Attendre que le Space reponde
        env:
          URL: ${{ steps.publication.outputs.space_url }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # Repli si l'etape precedente n'a pas transmis l'adresse : on la recalcule
          # a partir du nom du Space, plutot que d'interroger une adresse vide et de
          # boucler quinze minutes sans raison lisible.
          if [ -z "$URL" ]; then
            echo "Adresse du Space non transmise par l'etape precedente." >&2
            exit 1
          fi
          echo "Verification de $URL/health"
          # Hugging Face reconstruit l'image a chaque envoi : compter plusieurs minutes.
          for i in $(seq 1 60); do
            if curl -sf "$URL/health" | grep -q '"status"'; then
              echo "Space en ligne :"
              curl -s "$URL/health"
              echo
              echo "Documentation : $URL/docs"
              exit 0
            fi
            sleep 15
          done
          echo "Le Space n'a pas repondu en 15 minutes. Consulter ses journaux : $URL"
          exit 1
