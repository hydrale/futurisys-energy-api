[project]
name = "futurisys-energy-api"
version = "1.0.0"
description = "API de prediction de la consommation energetique des batiments de Seattle"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." en plus de "src" : les tests s'importent entre eux (from tests.conftest import
# ...), ce qui exige la racine du projet dans le chemin Python. Elle y est
# automatiquement avec "python -m pytest", qui ajoute le dossier courant, mais pas
# avec la commande "pytest" utilisee par l'integration continue. Sans cette ligne,
# la suite passe en local et echoue en CI.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# passlib appelle le module crypt, retire de Python 3.13. L'avertissement vient d'une
# dependance, pas du projet : on le masque pour que la sortie des tests reste lisible
# et qu'un vrai avertissement se remarque.
filterwarnings = [
    "error::FutureWarning",
    "ignore:'crypt' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/futurisys"]
omit = ["*/__init__.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
